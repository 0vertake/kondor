name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kondor
          POSTGRES_PASSWORD: kondor
          POSTGRES_DB: kondor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kondor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kondor:kondor@localhost:5432/kondor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: docker build -t kondor-crawler:ci .
